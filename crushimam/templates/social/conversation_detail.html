{% extends "crushimam/base.html" %}
{% block title %}Conversation - CrushImam Social{% endblock %}
{% block content %}
<div style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; height: 100vh;">
    <div style="padding: 16px; border-bottom: 1px solid #e0e0e0; background: white;">
        <h3>{{ other_user.username }}</h3>
    </div>
    
    <div id="messages" style="flex: 1; overflow-y: auto; padding: 16px; background: #f8f9fa;">
        {% for message in messages %}
        <div style="margin-bottom: 12px; display: flex; justify-content: {% if message.sender == user %}flex-end{% else %}flex-start{% endif %};">
            <div style="max-width: 70%; padding: 8px 12px; border-radius: 12px; background: {% if message.sender == user %}#667eea; color: white;{% else %}white;{% endif %}">
                <p style="margin: 0; font-size: 14px;">{{ message.text }}</p>
                <small style="font-size: 11px; opacity: 0.7;">{{ message.created_at|date:'g:i A' }}</small>
            </div>
        </div>
        {% endfor %}
    </div>

    <form method="POST" action="{% url 'social:send_message' conversation.id %}" style="padding: 16px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 8px;">
        {% csrf_token %}
        <input type="text" name="text" placeholder="Type a message..." style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 24px; outline: none;">
        <button type="submit" style="padding: 10px 16px; background: #667eea; color: white; border: none; border-radius: 24px; cursor: pointer;">Send</button>
    </form>
</div>
{% endblock %}
