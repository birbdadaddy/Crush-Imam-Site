{% extends "crushimam/base.html" %}
{% block title %}Story - CrushImam Social{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 20px auto;">
    <div style="aspect-ratio: 9/16; border-radius: 12px; overflow: hidden; background: #000; position: relative;">
        {% if story.media_type == 'image' %}
            <img src="{{ story.media_file.url }}" style="width: 100%; height: 100%; object-fit: cover;">
        {% else %}
            <video style="width: 100%; height: 100%; object-fit: cover; controls;"><source src="{{ story.media_file.url }}"></video>
        {% endif %}
        <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: white;">
            <p style="margin: 0; font-size: 12px;">{{ story.author.username }}</p>
            <small>{{ views }} views</small>
        </div>
    </div>
</div>
{% endblock %}
