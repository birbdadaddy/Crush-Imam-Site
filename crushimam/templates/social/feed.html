{% extends 'crushimam/base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/social.css' %}?v=1.3">
<header class="social-header" id="socialHeader">
        <div class="header-content social-container">
            <h1 class="header-title">Social</h1>
            <div class="header-actions">
                <button class="icon-btn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                    </svg>
                </button>
                <button class="icon-btn">
                    <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <!-- Feed -->
    <main class="container">
        <div class="feed-content">
            <!-- Create Post -->
            <div class="create-post-card">
                <div class="create-post-content">
                    <div class="avatar">{{request.user.username|slice:":1"|upper}}</div>
                    <button class="create-post-input">What's on your mind?</button>
                </div>
            </div>

            <!-- Post -->
            <article class="post-card">
                <div class="post-header">
                    <div class="post-user-info">
                        <div class="post-avatar">AB</div>
                        <div class="post-user-details">
                            <span class="post-username">alex_brown@example.com</span>
                            <span class="post-date">Jan 22</span>
                        </div>
                    </div>
                    <button class="icon-btn">
                        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"/>
                        </svg>
                    </button>
                </div>

                <div class="post-media">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=800" alt="Post">
                </div>

                <div class="post-actions-section">
                    <div class="post-actions">
                        <div class="post-actions-left">
                            <button class="action-btn">
                                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                                </svg>
                            </button>
                            <button class="action-btn">
                                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                                </svg>
                            </button>
                            <button class="action-btn">
                                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                                </svg>
                            </button>
                        </div>
                        <button class="action-btn">
                            <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/>
                            </svg>
                        </button>
                    </div>

                    <p class="post-likes">234 likes</p>

                    <div class="post-caption">
                        <span class="post-caption-username">alex_brown@example.com</span>
                        <span class="post-caption-text">Amazing sunset view from the beach today! 🌅</span>
                    </div>

                    <button class="view-comments-btn">View all 12 comments</button>
                </div>
            </article>
        </div>
    </main>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav">
        <div class="bottom-nav-content">
            <button class="nav-btn active">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                </svg>
            </button>
            <button class="nav-btn">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </button>
            <button class="nav-btn-create">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
            </button>
            <button class="nav-btn">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
                </svg>
            </button>
            <button class="nav-btn">
                <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </button>
        </div>
    </nav>

    <!-- FAB (Desktop) -->
    <button class="fab">
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
        </svg>
    </button>

<script>
// Scroll-based header behavior for Instagram/TikTok style header hiding
const socialHeader = document.getElementById('socialHeader');
const mainHeader = document.querySelector('body > header'); // The base.html navbar

let lastScrollY = 0;
let ticking = false;
const SCROLL_DOWN_THRESHOLD = 80;  // pixels to scroll down before hiding
const SCROLL_UP_THRESHOLD = 50;    // pixels scrolled up before showing
let isHeaderHidden = false;

function updateHeaderVisibility() {
    const currentScrollY = window.scrollY;
    const isScrollingDown = currentScrollY > lastScrollY;
    const scrollDelta = Math.abs(currentScrollY - lastScrollY);
    // Scrolling down past threshold - hide main navbar
    if (isScrollingDown && currentScrollY > SCROLL_DOWN_THRESHOLD && !isHeaderHidden) {
        if (mainHeader) {
            mainHeader.style.transform = 'translateY(-100%)';
        }
        isHeaderHidden = true;
    }
    // Scrolling up past threshold - show main navbar
    else if (!isScrollingDown && currentScrollY - lastScrollY < SCROLL_UP_THRESHOLD && isHeaderHidden) {
        if (mainHeader) {
            mainHeader.style.transform = 'translateY(0)';
        }
        isHeaderHidden = false;
    }
    
    lastScrollY = currentScrollY;
    ticking = false;
}

// Add transition to main header
if (mainHeader) {
    mainHeader.style.transition = 'transform 0.3s ease-out';
    mainHeader.style.position = 'sticky';
    mainHeader.style.top = '0';
    mainHeader.style.zIndex = '100';
}

window.addEventListener('scroll', () => {
    if (!ticking) {
        window.requestAnimationFrame(updateHeaderVisibility);
        ticking = true;
    }
}, { passive: true });

function likePost(postId, btn) {
    const liked = btn.dataset.liked === 'true';
    const formData = new FormData();
    
    fetch(`/social/post/${postId}/like/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        btn.dataset.liked = data.liked;
        btn.classList.toggle('liked', data.liked);
        btn.innerHTML = `<span class="icon">👍</span> Like (${data.count})`;
    });
}

function savePost(postId, btn) {
    const formData = new FormData();
    
    fetch(`/social/post/${postId}/save/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        btn.classList.toggle('saved', data.saved);
    });
}

function sharePost(postId) {
    const url = window.location.origin + `/social/post/${postId}/`;
    if (navigator.share) {
        navigator.share({
            title: 'Check out this post!',
            url: url
        });
    } else {
        alert('Link: ' + url);
    }
}

function togglePostMenu(btn) {
    const dropdown = btn.nextElementSibling;
    dropdown.classList.toggle('active');
}

function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}
</script>
{% endblock %}
